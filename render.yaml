services:
  - type: web
    name: zoya-services
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zoya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER_ID
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "ZoyaAdmin@2026"
      - key: USE_POSTGRES
        value: "true"
databases:
  - name: zoya-db
    databaseName: zoya_services
    user: zoya_admin
